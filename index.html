<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>顏色 + 淡出 綜合 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0e14;--panel:rgba(16,23,32,.82);--line:#1b2734;--line2:#243444;--text:#cdd9e6;--muted:#6b7f93;--cyan:#38e1d6;--steel:#4a6f8c;--amber:#f5a623;--orange:#ff7a2f;--red:#ff3b3b;--ok:#3ad17a;--display:'Chakra Petch',ui-monospace,monospace;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
body{font-family:var(--display);background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 0%,#13202c 0%,var(--bg) 62%)}
#c{display:block;width:100%;height:100%}
header{position:relative;z-index:5;display:flex;align-items:center;gap:1px;background:var(--panel);backdrop-filter:blur(10px);border-bottom:1px solid var(--line2)}
.brand{padding:12px 20px;border-right:1px solid var(--line)}
.brand .t{font-weight:700;letter-spacing:.04em;font-size:15px}.brand .s{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.metric{padding:10px 22px;border-right:1px solid var(--line)}
.metric .lab{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase}
.metric .val{font-family:var(--mono);font-weight:700;font-size:24px;color:var(--ok)}
.metric.phase .val{font-size:15px;color:var(--cyan);padding-top:5px}
.hint{position:absolute;left:50%;top:80px;transform:translateX(-50%);font-family:var(--mono);font-size:10px;color:var(--muted);background:#0d141dcc;border:1px solid var(--line2);padding:6px 12px;border-radius:7px;z-index:4}
#legend{position:absolute;right:16px;top:80px;z-index:4;background:var(--panel);backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:12px;padding:13px 15px;width:182px}
#legend .ttl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
.lg{display:flex;align-items:center;gap:9px;margin:6px 0;font-size:11px}.lg .sw{width:13px;height:13px;border-radius:3px;flex:none}
.grad{height:9px;border-radius:5px;margin:8px 0 3px;background:linear-gradient(90deg,#4a6f8c,var(--amber),var(--orange),var(--red))}
.grad-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--muted)}
#dock{position:absolute;left:16px;right:16px;bottom:16px;z-index:6;background:var(--panel);backdrop-filter:blur(12px);border:1px solid var(--line2);border-radius:14px;padding:14px 20px 16px;box-shadow:0 24px 60px -20px #000}
.ctrls{display:flex;align-items:center;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.ic{width:42px;height:42px;border-radius:9px;border:1px solid var(--line2);background:#ffffff06;color:var(--text);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
.ic:hover{border-color:var(--cyan);color:var(--cyan)}.ic.play{background:var(--cyan);color:#04181a;border-color:var(--cyan);width:50px}
.ctrl-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-left:4px}
.seg{display:flex;gap:1px;background:var(--line);border-radius:9px;overflow:hidden;border:1px solid var(--line2)}
.seg button{background:#ffffff04;border:0;color:var(--muted);font-family:var(--mono);font-size:11px;padding:0 13px;height:40px;cursor:pointer}.seg button.on{background:var(--cyan);color:#04181a;font-weight:700}
.fadectl{display:flex;align-items:center;gap:8px;margin-left:6px}
.fadectl input{width:90px}
input[type=range]{-webkit-appearance:none;appearance:none;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--cyan) 0,var(--cyan) var(--p,0%),#1a2734 var(--p,0%),#1a2734 100%);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--cyan);cursor:grab;box-shadow:0 2px 10px #000a}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid var(--cyan)}
#time{width:100%}
.ticks{display:flex;justify-content:space-between;margin-top:7px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
@media(max-width:760px){#legend{display:none}.brand .t{font-size:13px}.metric{padding:8px 14px}.metric .val{font-size:18px}}
</style></head>
<body><div id="app"><div id="stage"><canvas id="c"></canvas>
<div class="hint">滑鼠拖曳旋轉 · 拆除進度越高，顏色越紅、同時越透明</div>
<div id="legend"><div class="ttl">綜合色標</div>
<div class="grad"></div><div class="grad-l"><span>未拆</span><span>拆除中</span><span>近完成</span></div>
<div class="lg" style="margin-top:10px"><span class="sw" style="background:linear-gradient(135deg,#ff3b3b,transparent)"></span>進度越高 → 越紅＋越透明</div>
<div class="lg"><span class="sw" style="background:transparent;border:1.5px dashed #38e1d6aa"></span>已拆除</div></div>
</div>
<header><div class="brand"><div class="t">顏色 + 淡出 · 綜合呈現</div><div class="s">Color + Fade · Combined Demo</div></div>
<div class="metric"><div class="lab">拆除進度</div><div class="val" id="mProg">0%</div></div>
<div class="metric phase"><div class="lab">階段</div><div class="val" id="mPhase">未拆</div></div></header>
<div id="dock"><div class="ctrls">
<button class="ic play" id="play">▶</button><button class="ic" id="reset">⟲</button>
<span class="ctrl-lab">速度</span>
<div class="seg" id="speed"><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div>
<span class="ctrl-lab" style="margin-left:auto">自動環繞</span><button class="ic" id="autorot" style="width:42px">◎</button></div>
<input type="range" id="time" min="0" max="100" step="0.5" value="0">
<div class="ticks"><span>0%</span><span>25%</span><span>50%</span><span>75%</span><span>完成</span></div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x0a0e14,0.012);
const camera=new THREE.PerspectiveCamera(48,1,0.1,1000);
scene.add(new THREE.HemisphereLight(0xbcd6ff,0x0a0e14,0.95));
const key=new THREE.DirectionalLight(0xffffff,0.9);key.position.set(25,40,28);scene.add(key);
const fill=new THREE.DirectionalLight(0x66aaff,0.3);fill.position.set(-25,15,-20);scene.add(fill);
const grid=new THREE.GridHelper(90,24,0x1d3040,0x14222e);grid.material.transparent=true;grid.material.opacity=0.45;scene.add(grid);

const C_STEEL=new THREE.Color(0x4a6f8c),C_A=new THREE.Color(0xf5a623),C_B=new THREE.Color(0xff7a2f),C_C=new THREE.Color(0xff3b3b);
function ramp(p){const c=new THREE.Color();if(p<0.5)c.copy(C_A).lerp(C_B,p/0.5);else c.copy(C_B).lerp(C_C,(p-0.5)/0.5);return c;}

const mat=new THREE.MeshStandardMaterial({color:C_STEEL.clone(),roughness:.7,metalness:.12,flatShading:true,transparent:true,opacity:1});
const grp=new THREE.Group();let maxH=0;
[[8,7,0,7],[5.6,4,7,5],[3.2,3,11,3]].forEach(([w,h,y0,d])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.y=y0+h/2;grp.add(m);maxH=Math.max(maxH,y0+h);});
const pad=new THREE.Mesh(new THREE.BoxGeometry(9,0.4,9),new THREE.MeshStandardMaterial({color:0x16222e,roughness:1}));pad.position.y=0.2;grp.add(pad);
scene.add(grp);
// 已拆殘留線框
const ghost=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(8,7,7),20),new THREE.LineBasicMaterial({color:0x38e1d6,transparent:true,opacity:0.3}));
ghost.position.y=3.5;ghost.visible=false;scene.add(ghost);

let fadeStart=0.8;
function update(pct){
  const p=pct/100;
  if(p<=0){mat.color.copy(C_STEEL);mat.emissive.setRGB(0,0,0);mat.opacity=1;mat.depthWrite=true;grp.visible=true;ghost.visible=false;}
  else if(p>=0.999){grp.visible=false;ghost.visible=true;}
  else{
    grp.visible=true;ghost.visible=false;
    // 顏色與透明度同步:進度越高 → 越紅、越透明
    const c=ramp(p);mat.color.copy(c);mat.emissive.copy(c).multiplyScalar(0.32);
    mat.opacity=Math.max(0.04,1-p);
    mat.depthWrite=mat.opacity>0.6;
  }
  let phase= p<=0?'未拆': p>=0.999?'已拆除':'拆除中';
  document.getElementById('mProg').textContent=Math.round(pct)+'%';
  document.getElementById('mPhase').textContent=phase;
}

let theta=1.05,phi=1.16,radius=44,target=new THREE.Vector3(0,5,0);
function applyCam(){camera.position.set(target.x+radius*Math.sin(phi)*Math.cos(theta),target.y+radius*Math.cos(phi),target.z+radius*Math.sin(phi)*Math.sin(theta));camera.lookAt(target);}
let drag=false,lx=0,ly=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;});
addEventListener('pointerup',()=>drag=false);
addEventListener('pointermove',e=>{if(!drag)return;theta-=(e.clientX-lx)*0.006;phi=Math.max(0.3,Math.min(1.4,phi-(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY;});
canvas.addEventListener('wheel',e=>{e.preventDefault();radius=Math.max(22,Math.min(90,radius+e.deltaY*0.04));},{passive:false});

let curr=0,playing=false,speed=1,autorot=false;
const slider=document.getElementById('time'),playBtn=document.getElementById('play');
function set(v){curr=Math.max(0,Math.min(100,v));slider.value=curr;slider.style.setProperty('--p',curr+'%');update(curr);}
slider.addEventListener('input',()=>set(parseFloat(slider.value)));
playBtn.onclick=()=>{playing=!playing;if(curr>=100&&playing)set(0);playBtn.textContent=playing?'❚❚':'▶';};
document.getElementById('reset').onclick=()=>{playing=false;playBtn.textContent='▶';set(0);theta=1.05;phi=1.16;radius=44;};
document.getElementById('autorot').onclick=function(){autorot=!autorot;this.style.color=autorot?'var(--cyan)':'';this.style.borderColor=autorot?'var(--cyan)':'';};
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#speed button').forEach(x=>x.classList.remove('on'));b.classList.add('on');speed=parseFloat(b.dataset.s);});

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==Math.floor(w*devicePixelRatio)){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}}
let last=performance.now();
function loop(now){const dt=(now-last)/1000;last=now;
  if(playing){curr+=dt*speed*11;if(curr>=100){curr=100;playing=false;playBtn.textContent='▶';}slider.value=curr;slider.style.setProperty('--p',curr+'%');update(curr);}
  if(autorot&&!drag)theta+=dt*0.15;
  resize();applyCam();renderer.render(scene,camera);requestAnimationFrame(loop);}
set(0);applyCam();requestAnimationFrame(loop);
</script></body></html>
